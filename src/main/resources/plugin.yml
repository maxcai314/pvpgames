name: pvpgames
description: $description
version: '${version}'

main: ax.xz.max.pvpgames.PvpgamesPlugin
paperPluginLoader: ax.xz.max.pvpgames.PvpgamesLoader
api-version: '1.21.11'
load: POSTWORLD

# Soft dependencies: if these plugins are installed, load them BEFORE us so we
# can call into their APIs at enable. Listed plugins are NOT required; the
# plugin still loads if they're absent — be sure to null/`Bukkit.getPluginManager().isPluginEnabled(...)`-check
# before calling into them in code.
softdepend:
  - WorldEdit
  - Multiverse-Core

permissions:
  pvpgames.kit.admin:
    description: Grants every kit-management subcommand. Convenient parent node.
    default: op
    children:
      pvpgames.kit.create: true
      pvpgames.kit.load: true
      pvpgames.kit.delete: true
      pvpgames.kit.list: true
      pvpgames.kit.info: true
  pvpgames.kit.create:
    description: Save the running player's inventory as a named kit.
    default: op
  pvpgames.kit.load:
    description: Load a saved kit into the running player's inventory.
    default: op
  pvpgames.kit.delete:
    description: Permanently delete a saved kit.
    default: op
  pvpgames.kit.list:
    description: List the names of all saved kits.
    default: op
  pvpgames.kit.info:
    description: Show metadata (creator, creation date) for a saved kit.
    default: op
  pvpgames.arena.admin:
    description: Grants every arena-management subcommand. Convenient parent node.
    default: op
    children:
      pvpgames.arena.create: true
      pvpgames.arena.delete: true
      pvpgames.arena.list: true
      pvpgames.arena.info: true
      pvpgames.arena.preview: true
      pvpgames.arena.modify: true
  pvpgames.arena.create:
    description: Define a new arena referencing a schematic.
    default: op
  pvpgames.arena.delete:
    description: Remove an arena's data file.
    default: op
  pvpgames.arena.list:
    description: List all arena names.
    default: op
  pvpgames.arena.info:
    description: Show arena metadata (schematic, spawn count, creator, created date).
    default: op
  pvpgames.arena.preview:
    description: Open a preview void world and leave it via /arena leave.
    default: op
  pvpgames.arena.modify:
    description: Add, list, visit, or remove spawn points in the previewed arena.
    default: op
